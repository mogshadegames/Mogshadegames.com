<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mogshade Games — Open the door. See what's waiting.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#EAE3D5;
    --ink:#241D16;
    --ink-soft:#4A4034;
    --forest-dark:#1E3327;
    --rust:#BC4E2C;
    --rust-dark:#9E3F21;
    --line: rgba(36,29,22,0.16);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.5;}
  h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;letter-spacing:-0.01em;}
  a{color:inherit;text-decoration:none;}
  img{display:block;max-width:100%;border-radius:8px;}
  .wrap{max-width:1080px;margin:0 auto;padding:0 28px;}
  @media(max-width:640px){.wrap{padding:0 18px;}}

  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:5px;font-weight:600;font-size:15px;border:none;cursor:pointer;}
  .btn-primary{background:var(--rust);color:#FBF3EA;}
  .btn-primary:hover{background:var(--rust-dark);}
  .btn-link{text-decoration:underline;text-underline-offset:4px;color:var(--forest-dark);}

  header.site{border-bottom:1px solid var(--line);padding:16px 0;}
  nav{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:16px;}
  .logo{display:flex;align-items:center;gap:10px;}
  .logo img{width:34px;height:34px;border-radius:0;}
  .logo-word{font-family:'Fraunces',serif;font-weight:600;font-size:18px;line-height:1.15;}
  .nav-links{display:flex;gap:24px;flex-wrap:wrap;}
  .nav-links a{font-size:15px;color:var(--ink-soft);}
  .nav-links a:hover{color:var(--ink);}

  section{padding:60px 0;}
  .hero{padding-top:64px;}
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;}
  @media(max-width:860px){.hero-grid{grid-template-columns:1fr;}}
  .hero h1{font-size:clamp(34px,5vw,52px);line-height:1.08;}
  .hero p{margin:20px 0 28px;max-width:44ch;color:var(--ink-soft);font-size:17px;}
  .hero-ctas{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}

  .section-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:28px;flex-wrap:wrap;gap:12px;}
  .section-head h2{font-size:clamp(26px,3.2vw,36px);}
  .kicker{font-size:12px;font-weight:600;color:var(--ink-soft);}

  .games-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  @media(max-width:860px){.games-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.games-grid{grid-template-columns:1fr;}}
  .games-grid img{width:100%;transition:transform .15s ease;}
  .games-grid a:hover img{transform:translateY(-3px);}

  .about-band{background:var(--forest-dark);}
  .about-band .wrap{background:#39253f;border-radius:10px;padding:48px;color:#F1E7EA;}
  .about-grid{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:center;}
  @media(max-width:860px){.about-grid{grid-template-columns:1fr;}.about-band .wrap{padding:28px;}}
  .about-band h2{color:#F7EFE9;font-size:clamp(28px,3.6vw,40px);}
  .about-band p{color:#DCC9CE;max-width:44ch;margin:16px 0 24px;}
  .about-band img{border-radius:6px;}
  .btn-cream{background:var(--cream);color:var(--forest-dark);}

  .workshop-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:18px;}
  @media(max-width:860px){.workshop-grid{grid-template-columns:1fr 1fr;}}
  @media(max-width:600px){.workshop-grid{grid-template-columns:1fr;}}
  .post-card{background:#F1ECE0;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .post-card img{border-radius:0;width:100%;height:130px;object-fit:cover;}
  .post-body{padding:16px 18px 20px;}
  .post-date{font-size:12px;color:var(--ink-soft);}
  .post-card h3{font-family:'Fraunces',serif;font-size:18px;margin:6px 0 8px;font-weight:600;}
  .post-card p{font-size:14px;color:var(--ink-soft);margin:0 0 12px;}
  .post-link{font-size:13.5px;font-weight:600;color:var(--rust);}

  .newsletter{margin-top:20px;background:#A9B98C;color:#3A4A2A;border-radius:10px;padding:26px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;}
  .newsletter h3{font-family:'Fraunces',serif;font-size:19px;margin:0 0 6px;}
  .newsletter p{margin:0;font-size:13.5px;max-width:40ch;}
  .newsletter form{display:flex;gap:10px;flex-wrap:wrap;}
  .newsletter input{padding:11px 14px;border-radius:5px;border:1px solid rgba(58,74,42,0.35);font-family:inherit;font-size:14px;}

  footer{background:var(--forest-dark);color:#E7E0D3;padding:36px 0;}
  .footer-grid{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;}
  .footer-logo{display:flex;align-items:center;gap:10px;}
  .footer-logo img{width:28px;height:28px;}
  .footer-links{display:flex;gap:22px;flex-wrap:wrap;}
  .footer-links a{font-size:14px;color:#CBC2AE;}
  .footer-bottom{margin-top:20px;padding-top:18px;border-top:1px solid rgba(231,224,211,0.15);font-size:12.5px;color:#A9A08B;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;}
</style>
</head>

    <div class="wrap hero-grid">
      <div>
        <h1>Open the door.<br>See what's waiting.</h1>
        <p>Games for gathering around tables, wandering into old stories, and finding out what an ordinary evening can become.</p>
        <div class="hero-ctas">
          <a href="#games" class="btn btn-primary">Explore Our Games →</a>
          <a href="#about" class="btn-link">What is Mogshade?</a>
